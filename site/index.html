<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="theme-color" content="#17150f">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>АЙДА! — игра</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#17150f;--panel:#242017;--line:#4a4129;--red:#f01e2d;--sand:#e8dfae;--dim:#a39b72;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--sand);font:14px/1.35 'Russo One',Arial,sans-serif;touch-action:manipulation}
.wrap{max-width:1000px;margin:0 auto;padding:10px}
h1{margin:0;font-size:clamp(46px,13vw,88px);line-height:.9;color:var(--red);letter-spacing:1px;text-shadow:3px 3px 0 #000;transform:skewX(-6deg);display:inline-block}
.tag{font-size:clamp(16px,4vw,24px);color:var(--red);text-transform:uppercase;margin:4px 0 10px;transform:skewX(-6deg);display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-bottom:10px}
.stats div{background:var(--panel);border:2px solid var(--line);padding:6px 8px}
.stats span{display:block;font-size:10px;color:var(--dim)}
.stats b{font:12px 'Press Start 2P',monospace;color:var(--sand)}
#sa{color:var(--red);font-size:16px}
.main{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:760px){.main{grid-template-columns:1fr}}
canvas{width:100%;display:block;image-rendering:pixelated;border:3px solid var(--line);background:#000;cursor:crosshair}
.hpw{background:#000;border:2px solid var(--line);height:18px;margin-top:6px;position:relative}
#hp{height:100%;background:var(--red);width:100%}
#hpt{position:absolute;inset:0;text-align:center;font-size:11px;line-height:14px;text-shadow:1px 1px 0 #000}
#punch{width:100%;margin-top:8px;padding:16px;font:inherit;font-size:26px;text-transform:uppercase;background:var(--red);color:#fff;border:0;border-bottom:6px solid #8a0f19;cursor:pointer;transform:skewX(-6deg)}
#punch:active{transform:skewX(-6deg) translateY(4px);border-bottom-width:2px}
#story{background:var(--panel);border-left:4px solid var(--red);padding:8px 10px;margin:8px 0 0;color:var(--dim);font-size:13px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{flex:1;padding:9px 4px;font:inherit;background:var(--panel);color:var(--dim);border:2px solid var(--line);cursor:pointer}
.tabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
#panel{background:var(--panel);border:2px solid var(--line);margin-top:6px;padding:6px;max-height:470px;overflow-y:auto}
.it{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:7px 4px;border-bottom:1px dashed var(--line)}
.it small{display:block;color:var(--dim);font-size:12px}
.it button{flex:none;min-width:92px;padding:8px;font:11px 'Press Start 2P',monospace;background:#e8dfae;color:#17150f;border:0;border-bottom:3px solid #8f844f;cursor:pointer}
.it button.no{opacity:.35;cursor:not-allowed}
.it.lock{opacity:.5}
.q{padding:8px 4px}.q h3{margin:0 0 4px;color:var(--red);font-size:18px}
.q button{margin-top:8px;padding:10px 14px;font:inherit;background:var(--red);color:#fff;border:0;cursor:pointer}
.bar{background:#000;height:10px;margin-top:6px;border:1px solid var(--line)}.bar i{display:block;height:100%;background:var(--sand)}
.nbox{background:var(--panel);border:2px solid var(--line);border-left:4px solid var(--red);padding:10px;margin-top:8px;min-height:84px;font-size:15px}#nc{display:grid;gap:6px;margin-top:8px}#nc.keys{grid-template-columns:repeat(4,1fr)}#nc button{padding:11px;font:inherit;font-size:14px;text-align:left;background:var(--sand);color:#17150f;border:0;border-bottom:3px solid #8f844f;cursor:pointer}#nc button.big{background:var(--red);color:#fff;font-size:24px;text-align:center;padding:18px;border-bottom-color:#8a0f19;text-transform:uppercase}#nc button.key{font-size:24px;text-align:center}#nl{background:none;border:0;color:var(--dim);font:inherit;font-size:12px;margin-top:8px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--red);color:#fff;padding:10px 16px;max-width:92vw;text-align:center;display:none;z-index:5}
#end{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:20px;z-index:9;text-align:center}
#end div{max-width:520px}#end h2{font-size:44px;color:var(--red);margin:0 0 10px}
#end button,#rst,#snd{padding:10px 16px;font:inherit;background:var(--sand);color:#17150f;border:0;cursor:pointer;margin-top:12px}
#rst,#snd{background:none;color:var(--dim);font-size:11px;margin:8px 0 0;padding:4px}
</style></head><body><div class="wrap">
<h1>АЙДА!</h1><span class="tag">Скажи своим: мы идём</span>
<div class="stats">
<div><span>АВТОРИТЕТ</span><b id="sa">0</b></div>
<div><span>СТАТУС</span><b id="ss" style="font-size:10px">—</b></div>
<div><span>УДАР</span><b id="sp">1</b></div>
<div><span>БАНДА / СЕК</span><b id="sd">0</b></div>
<div><span>ТАЧКА / СЕК</span><b id="si">0</b></div>
<div><span>ПОБИТО</span><b id="sk">0</b></div>
</div>
<div class="main"><div>
<canvas id="cv" width="320" height="180"></canvas>
<div class="hpw"><div id="hp"></div><div id="hpt"></div></div>
<button id="punch">Бить чушпана!</button>
<p id="story"></p>
<div id="nv" style="display:none"><div class="nbox" id="nt"></div><div id="nc"></div><button id="nl" onclick="natExit()">← вернуться к пацанам</button></div>
</div><div>
<div class="tabs"><button data-t="g" class="on">Пацаны</button><button data-t="o">Шмот</button><button data-t="c">Тачки</button><button data-t="q">Задания</button><button data-t="b">Банда</button><button data-t="n">Пойти к Наташе</button></div>
<div id="panel"></div>
<button id="snd">🔊 звук вкл</button> <button id="rst">сбросить прогресс</button>
</div></div></div>
<div id="toast"></div>
<div id="end"><div><h2 id="et"></h2><p id="ep"></p><p style="color:var(--red)">Сериал «Айда!» — антиманифест насилию. Мордобой на кнопку — только игра.</p><button id="ec">Продолжить играть</button></div></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d');
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':Math.floor(n)+'';
const OUT=[
{n:'Волгоградский прикид',d:'Что есть. Для Казани — слишком приличный.',pw:1,cost:0,o:{top:'#9db3cc',pants:'#3b4560',shoe:'#1c1c1c',hair:'#4a3020'}},
{n:'Синяя олимпийка',d:'Спортивный костюм, белые полоски.',pw:3,cost:40,o:{top:'#2748c7',acc:'#fff',pants:'#2748c7',shoe:'#eee',hair:'#4a3020'}},
{n:'Поло с кармашком и клёш',d:'Тёмно-синее поло, ремень, брюки клёш.',pw:8,cost:200,o:{top:'#1a2f86',acc:'#e8e8e8',pants:'#3a4560',shoe:'#222',hair:'#4a3020'}},
{n:'Красная куртка, белая майка, джинсы',d:'Так ходят старшие.',pw:20,cost:900,o:{top:'#b2231f',under:'#f5f5f5',pants:'#2f4f8a',shoe:'#222',hair:'#4a3020'}},
{n:'Яркая куртка и коричневые клёши',d:'Полосатый свитер. Все оборачиваются.',pw:60,cost:4000,o:{top:'#1f9bc0',acc:'#f0792a',pants:'#6b3a22',shoe:'#eee',hair:'#4a3020'}}];
const CARS=[
{n:'Велик «Орлёнок»',d:'Хоть какой-то транспорт.',inc:1,cost:150},
{n:'Мопед «Верховина»',d:'Тарахтит на весь двор.',inc:6,cost:1000},
{n:'ВАЗ-2101 «Копейка»',d:'Мечта любого парня с района.',inc:30,cost:6000},
{n:'ГАЗ-24 «Волга»',d:'Это уже уровень.',inc:150,cost:35000}];
const GANG=[
{n:'Пацан из двора',d:'Идёт, если крикнуть «Айда!»',dps:1,cost:25,un:0,o:{top:'#4b3a9c',pants:'#2748c7',shoe:'#222',skin:'#e6c9a8',hair:'#5a4030'}},
{n:'Тип',d:'Влиятельный пацан банды.',dps:6,cost:180,un:150,o:{top:'#1c1c1c',acc:'#eee',pants:'#2748c7',shoe:'#eee',skin:'#e6c9a8',hair:'#3a2a1a'}},
{n:'Хан',d:'Слово Хана на районе — закон.',dps:28,cost:900,un:1000,o:{top:'#3a2f8a',pants:'#8a8a8a',shoe:'#222',skin:'#e0be98',hair:'#2a1a10'}},
{n:'Ряба',d:'Бывший пионервожатый. Сила и сленг.',dps:120,cost:4500,un:5000,o:{top:'#b2231f',under:'#f5f5f5',pants:'#2f4f8a',shoe:'#222',skin:'#e6c9a8',bald:1}},
{n:'Захаревич',d:'Врач-психотерапевт. Знает, на что давить.',dps:500,cost:22000,un:20000,o:{top:'#6a4a32',under:'#ddd',pants:'#333',shoe:'#111',skin:'#e6c9a8',hair:'#999',glass:1}}];
const gN=()=>S.g.reduce((a,b)=>a+b,0);
const Q=[
{t:'Новенький в городе',d:'Побить 5 чушпанов',p:()=>[S.kills,5],r:20,s:'Казань — не Волгоград. Здесь улицы поделены, а правил тебе никто не объяснял.'},
{t:'Правила улицы',d:'Побить 20 чушпанов',p:()=>[S.kills,20],r:80,s:'Крикни «Айда!» — и двор пойдёт за тобой.'},
{t:'Форма — это статус',d:'Купить синюю олимпийку',p:()=>[S.o>=1?1:0,1],r:60,s:'В костюме ты уже не чужак. Пацаны смотрят иначе.'},
{t:'Своя компания',d:'Нанять 3 пацанов',p:()=>[gN(),3],r:250,s:'Захаревич слушает, не перебивая. Ему интересно, за кем пойдут люди.'},
{t:'Разборка с «Заводскими»',d:'Победить главаря «Заводских» за 30 секунд',boss:{n:'Главарь «Заводских»',hp:700,time:30,o:{bald:1,top:'#444',acc:'#777',pants:'#222',shoe:'#111',skin:'#d9b690'}},r:600,s:'«Заводские» отступили. Про тебя заговорили в соседних дворах.'},
{t:'Колёса',d:'Купить любой транспорт',p:()=>[S.car.some(x=>x)?1:0,1],r:300,s:'На колёсах — другое уважение.'},
{t:'Район под контролем',d:'Побить 150 чушпанов',p:()=>[S.kills,150],r:1500,s:'Ряба вводит новые ритуалы. Теперь у банды есть свой язык.'},
{t:'Война с «Заречными»',d:'Победить главаря «Заречных» за 40 секунд',boss:{n:'Главарь «Заречных»',hp:9000,time:40,o:{top:'#1f6a3a',acc:'#eee',pants:'#222',shoe:'#eee',skin:'#e0be98',hair:'#111'}},r:6000,s:'Теплоконтроль — самый громкий район города.'},
{t:'Авторитет',d:'Заработать за всё время 20 000',p:()=>[S.tot,20000],r:5000,s:'Партийные органы делают вид, что ничего не происходит. Но милиция уже следит.'},
{t:'Облава Никонова',d:'Выдержать облаву полковника Никонова (45 секунд)',fin:1,boss:{n:'Полковник Никонов',hp:120000,time:45,o:{top:'#4a5a6a',acc:'#c9a23a',pants:'#33404d',shoe:'#111',skin:'#e0be98',hair:'#333',cap:'#3a4a5a'}},r:0,s:''}];
const TIERS=[[0,'Новенький'],[100,'Свой'],[1000,'Пацан с района'],[10000,'Авторитет'],[50000,'Старший']];
OUT[1].o.trk=1;OUT[2].o.pocket=OUT[2].o.flare=1;OUT[3].o.flare=OUT[4].o.flare=1;OUT[3].o.cig=OUT[4].o.cig=1;GANG[0].o.cap='#3a3a3a';GANG[1].o.cig=GANG[1].o.trk=1;GANG[2].o.pipe=GANG[2].o.flare=1;GANG[3].o.cig=GANG[3].o.flare=1;Q[4].boss.o.pipe=1;Q[7].boss.o.cig=1;Q[7].boss.o.pipe=1;Q[9].boss.o.cig=1;
OUT.push({n:'Кожанка и чёрные клёши',d:'Чёрная кожа, белая майка.',pw:150,cost:15000,o:{top:'#222222',under:'#dddddd',pants:'#1a1a22',shoe:'#111111',hair:'#4a3020',flare:1,cig:1}},{n:'Дублёнка и ушанка',d:'Зимний статус. В неё даже мороз не страшен.',pw:400,cost:45000,o:{top:'#8a5a2a',acc:'#e8d8b0',pants:'#333333',shoe:'#222222',hair:'#4a3020',cap:'#5a4030',flare:1,cig:1}},{n:'Костюм-тройка и лакировки',d:'Почти директор рынка.',pw:1100,cost:120000,o:{top:'#2a2a3a',under:'#f5f5f5',pants:'#2a2a3a',shoe:'#111111',hair:'#4a3020',cig:1}});
CARS.push({n:'«Чайка» ГАЗ-13',d:'Для самых старших.',inc:450,cost:120000},{n:'Mercedes W123',d:'Из Германии. Весь район в шоке.',inc:1500,cost:400000});
const ITEMS=[{n:'Кепка-«аэродром»',d:'Для самоуверенности.',cost:60,pw:1},{n:'Часы «Ракета»',d:'Время знать надо.',cost:150,inc:1},{n:'Ремень с бляхой',d:'Тяжёлая бляха.',cost:300,pw:2},{n:'Кусок трубы',d:'Аргумент в споре.',cost:500,pw:4},{n:'Магнитофон «Весна»',d:'Музыка на весь двор.',cost:800,inc:4},{n:'Кожаные перчатки',d:'Кулаки теперь тяжелее.',cost:1500,pw:8},{n:'Тёмные очки',d:'Никто не видит твоих глаз.',cost:2500,inc:8},{n:'Золотая цепочка',d:'Видно за квартал.',cost:6000,inc:20},{n:'Радиола «Ригонда»',d:'Для вечеринок.',cost:12000,inc:40},{n:'Часы «Командирские»',d:'Только для своих.',cost:25000,inc:90},{n:'Тяжёлый перстень',d:'Поверь, это весомо.',cost:40000,pw:60}];
const AUTH=[{n:'Стас Белорус',d:'Авторитет с района: светлые волосы, белая олимпийка, слово слушают.',cost:300,dps:20,pw:3,o:{top:'#eeeeee',acc:'#c0283a',trk:1,pants:'#c0283a',shoe:'#eeeeee',skin:'#f0d4b8',hair:'#e8d890',cig:1,pipe:1}}];
const pwr=()=>OUT[S.o].pw+ITEMS.reduce((a,x,i)=>a+(S.it[i]?x.pw||0:0),0)+AUTH.reduce((a,x,i)=>a+(S.au[i]?x.pw||0:0),0);
const pk=a=>a[Math.random()*a.length|0],CN=['Чушпан','Ботан','Очкарик','Тихоня','Зубрила','Маменькин сынок','Отличник'];
function chu(){if(Object.keys(SC).length>300)for(const k in SC)delete SC[k];
const o={skin:pk(['#e6c9a8','#f0d4b8','#d9b690','#e0be98']),hair:pk(['#6b5a3a','#2a1a10','#a08040','#c9a050','#4a3020','#8a3a1a']),top:pk(['#8a8a86','#7d8a9a','#9a8a7a','#8a9a82','#a39ab0','#b0a070','#7a6a9a']),pants:pk(['#a89878','#6a6a70','#4a5a6a','#7a6a50','#5a4a3a']),shoe:pk(['#3a2a1a','#222222','#4a3a2a']),scared:1};
if(Math.random()<.5)o.glass=1;if(Math.random()<.5)o.bag=1;if(Math.random()<.25)o.cap=pk(['#5a4a3a','#3a4a5a','#6a3a3a']);if(Math.random()<.2)o.under=pk(['#f5f5f5','#e8d0a0']);if(Math.random()<.15)o.bald=1;if(Math.random()<.25){o.acc=pk(['#c9c9a0','#a0a0c9']);if(Math.random()<.4)o.pocket=1}return o}
const S0=()=>({au:[],it:[],a:0,tot:0,kills:0,o:0,car:[0,0,0,0],g:[0,0,0,0,0],q:0,end:0});
let S=S0();
try{const j=JSON.parse(localStorage.getItem('aida1')||'null');if(j)S=Object.assign(S0(),j)}catch(e){}
let E,B=null,tab='g',hitT=0,shk=0,fx=[],tm=0,rk='',story='1978 год. Гриша Хрипунов переезжает из Волгограда в Казань. Чужой город, чужие правила.';
const CH=['#8a8a86','#7d8a9a','#9a8a7a','#8a9a82','#a39ab0'];
function spawn(){const k=Math.min(S.kills,200),hp=Math.round(5*1.045**k);
E={hp,max:hp,rw:Math.max(2,Math.round(2*1.04**k)),boss:0,n:pk(CN),s:2,o:chu()}}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',3200)}
const gcost=i=>Math.ceil(GANG[i].cost*1.15**S.g[i]);
function done(){const q=Q[S.q];S.a+=q.r;S.tot+=q.r;if(q.s){story=q.s;$('story').textContent=story}
SFX.quest();toast('Задание выполнено: '+q.t+(q.r?' +'+q.r+' ★':''));S.q++;if(q.fin)ending(1);render()}
function ending(w){S.end=1;$('et').textContent=w?'Ты отбился':'Тебя взяли';
$('ep').textContent=w?'Никонов отступил — но не навсегда. Такие истории всё равно кончаются плохо.':'Никонов закрыл дело. Статья «Бандитизм». Банда разгромлена, пацаны разошлись.';$('end').style.display='flex'}
function kill(){S.kills++;if(E.boss){B=null;done();}else{SFX.kill();S.a+=E.rw;S.tot+=E.rw;fx.push({x:215,y:70,t:1,tx:'+'+fmt(E.rw)+'★',c:'#7bd36a'})}spawn()}
function startBoss(){const q=Q[S.q];if(!q||!q.boss||B)return;const b=q.boss;SFX.boss();B={t:b.time};E={hp:b.hp,max:b.hp,boss:1,n:b.n,s:3,o:b.o};render()}
function failBoss(){B=null;SFX.fail();const q=Q[S.q];spawn();if(q.fin){S.q++;ending(0)}else toast('Не вышло. Прокачайся и попробуй снова!');render()}
function punch(){if(nm)return;const c=Math.random()<.12,d=pwr()*(c?3:1);hitT=1;shk=1;c?SFX.crit():SFX.hit();
fx.push({x:195+Math.random()*30,y:85,t:1,tx:(c?'КРИТ ':'-')+d,c:c?'#f01e2d':'#fff'});
E.hp-=d;if(E.hp<=0)kill()}
$('punch').addEventListener('pointerdown',punch);cv.addEventListener('pointerdown',punch);
function stats(){let d=0,i=0;GANG.forEach((g,k)=>d+=g.dps*S.g[k]);CARS.forEach((c,k)=>i+=c.inc*(S.car[k]||0));ITEMS.forEach((x,k)=>i+=(S.it[k]?x.inc||0:0));AUTH.forEach((x,k)=>d+=(S.au[k]?x.dps:0));return[d,i]}
setInterval(()=>{const[d,i]=stats();S.a+=i/10;S.tot+=i/10;
if(d>0){E.hp-=d/10;if(Math.random()<.25){shk=.6;hitT=.6;SFX.thud()}if(E.hp<=0)kill()}
if(B&&!nm){B.t-=.1;if(B.t<=0)failBoss()}
const q=Q[S.q];if(q&&!q.boss){const[c,t]=q.p();if(c>=t)done()}},100);
setInterval(()=>{try{localStorage.setItem('aida1',JSON.stringify(S))}catch(e){}},4000);
function buy(t,i){const A=S.a;buy0(t,i);S.a<A?SFX.buy():SFX.no()}
function buy0(t,i){let c;
if(t==='g'){c=gcost(i);if(S.tot<GANG[i].un||S.a<c)return;S.a-=c;S.g[i]++}
